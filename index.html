<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Calculadora - Suma</title>
</head>
<body>
    <h1>Calculadora - Operación de Suma</h1>
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <button onclick="sumar()">Sumar</button>
    <p id="resultado"></p>

    <script>
        function sumar() {
            let n1 = parseFloat(document.getElementById('num1').value) || 0;
            let n2 = parseFloat(document.getElementById('num2').value) || 0;
            let total = n1 + n2;
            document.getElementById('resultado').innerText = "El resultado es: " + total;
        }
    </script>
</body>
</html>
